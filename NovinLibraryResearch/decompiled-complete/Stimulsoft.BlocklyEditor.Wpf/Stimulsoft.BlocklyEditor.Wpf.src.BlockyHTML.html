    <script>
        var workspace;

        function getBlockCount() {
            return Blockly.mainWorkspace.getAllBlocks().length;
        }

        function checkState(event) {
            document.getElementById("divEmpty").style.display = getBlockCount() > 0 ? "none" : "block";
        }

        function initScript() {
            var blocklyJS = window.chrome.webview.hostObjects.sync.dotnet.GetBlocklyJS();
            addScript(blocklyJS);

            var bocksJS = window.chrome.webview.hostObjects.sync.dotnet.GetBlocksJS();
            addScript(bocksJS);

            var locJS = window.chrome.webview.hostObjects.sync.dotnet.GetLocJS();
            addScript(locJS);
        }

        function addScript(msg) {
            var scr = document.createElement('script');

            scr.innerHTML = msg;

            document.body.appendChild(scr);
        }

        function init() {

            var toolboxXML = window.chrome.webview.hostObjects.sync.dotnet.GetToolboxXML();
            var workspaceXML = window.chrome.webview.hostObjects.sync.dotnet.GetBlockyWorkspace();
            initBlocks();

            var options = {
                media: '../../media/',
                toolbox: toolboxXML,
                zoom: {
                    controls: true,
                    wheel: true,
                    startScale: 1,
                    maxScale: 3,
                    minScale: 0.3,
                    scaleSpeed: 1.2
                }
            }

            workspace = Blockly.inject('host', options);
            var wx = Blockly.Xml.textToDom(workspaceXML)

            Blockly.Xml.domToWorkspace(wx, workspace);

            Blockly.mainWorkspace.addChangeListener(checkState);
        }

        function update() {
            var xml = window.chrome.webview.hostObjects.sync.dotnet.XML;

            var dom = Blockly.Xml.textToDom(xml);
            Blockly.mainWorkspace.clear();
            Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, dom);
        }

        function showCode() {
            Blockly.JavaScript.INFINITE_LOOP_TRAP = null;
            var code = Blockly.JavaScript.workspaceToCode(workspace);
            return code;
        }

        function runCode() {
            window.LoopTrap = 1000;
            Blockly.JavaScript.INFINITE_LOOP_TRAP =
                'if (--window.LoopTrap == 0) throw "Infinite loop.";\n';
            var code = Blockly.JavaScript.workspaceToCode(workspace);
            Blockly.JavaScript.INFINITE_LOOP_TRAP = null;
            try { eval(code); } catch (e) { alert(e); }
        }

        function getXmlText() {
            var xml = Blockly.Xml.workspaceToDom(workspace);

            return b64EncodeUnicode(Blockly.Xml.domToText(xml));
        }

        function b64EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
                function toSolidBytes(match, p1) {
                    return String.fromCharCode('0x' + p1);
                }));
        }

        function setSample(xml) {
            var dom = Blockly.Xml.textToDom(xml);
            Blockly.mainWorkspace.clear();
            Blockly.Xml.domToWorkspace(Blockly.mainWorkspace, dom);
        }
