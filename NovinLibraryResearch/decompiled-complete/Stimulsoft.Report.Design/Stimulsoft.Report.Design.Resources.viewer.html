<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=10">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="stimulsoft.viewer.office2013.whiteblue.css" rel="stylesheet">
    <script src="stimulsoft.reports.js" type="text/javascript"></script>
    <script src="stimulsoft.reports.maps.js" type="text/javascript"></script>
    <script src="stimulsoft.viewer.js" type="text/javascript"></script>
    <script src="report.js" type="text/javascript"></script>

    <script type="text/javascript">
        var options = new Stimulsoft.Viewer.StiViewerOptions();
        options.appearance.scrollbarsMode = true;
        options.appearance.fullScreenMode = true;
        options.exports.showExportToDocument = false;
        options.toolbar.showAboutButton = false;

        var viewer = new Stimulsoft.Viewer.StiViewer(options, "StiViewer", false);
        viewer.onEndExportReport = function (args) {
            args.preventDefault = true;
            window.external.ExportTo(args.format.toString(), args.fileName, args.openAfterExport, Stimulsoft.System.Convert.toBase64String(args.data));
        }
    </script>
</head>
<body>
	<script type="text/javascript">
		viewer.renderHtml();
		var report = new Stimulsoft.Report.StiReport();
        report.loadDocument(reportJson);
		viewer.report = report;
	</script>
</body>
</html>
